 <!-- <!DOCTYPE html>
<html>
<body>
<input type="number" id="num" placeholder="Enter number">
<button onclick="checkPrime()">Check</button>

<div id="result"></div>

<script>
function checkPrime() {
    let n = Number(document.getElementById("num").value);

    if (n < 2) {
        result.innerHTML = "Neither Prime nor Composite";
        return;
    }

    let prime = true;

    for (let i = 2; i <= Math.sqrt(n); i++) {
        if (n % i === 0) {
            prime = false;
            break;
        }
    }

    result.innerHTML = prime ? "Prime Number" : "Composite Number";
}
</script>
</body>
</html> -->

    let m = Number(marks.value);
    let g;

    else if (m >= 75) g = "B";
    else if (m >= 60) g = "C";
    else if (m >= 40) g = "D";
    else g = "F";

    let msg;

    switch(g){

        case "B": msg="Very Good"; break;
        case "C": msg="Good"; break;
        case "D": msg="Pass"; break;
        default: msg="Fail";
    }

    output.innerHTML = "Grade : " + g + "<br>" + msg;
}
</script>
